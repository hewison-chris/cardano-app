<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cardano Time Vault</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="/static/elm.js"></script>
    <script src="/static/wallet.js"></script>
    <script>
      const app = Elm.Main.init({
        node: document.getElementById("app"),
        flags: { now: Date.now(), tzOffset: new Date().getTimezoneOffset() },
      });
      VaultWallet.attach(app);
    </script>
  </body>
</html>
