name: Deploy Elm Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies & Build Elm
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Configure Backend API Base URL
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          # Inject BACKEND_URL into index.html if configured in GitHub Actions variables
          if [ -n "$BACKEND_URL" ]; then
            echo "Configuring API Base URL: $BACKEND_URL"
            sed -i "s|apiBaseUrl: window.API_BASE_URL || \"\"|apiBaseUrl: \"$BACKEND_URL\"|g" frontend/public/index.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "frontend/public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

