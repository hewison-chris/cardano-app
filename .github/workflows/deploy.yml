name: Deploy Elm Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies & Build Elm
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Configure Backend API Base URL
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          # Inject BACKEND_URL into index.html if configured in GitHub Actions variables
          if [ -n "$BACKEND_URL" ]; then
            echo "Configuring API Base URL: $BACKEND_URL"
            sed -i "s|apiBaseUrl: window.API_BASE_URL || \"\"|apiBaseUrl: \"$BACKEND_URL\"|g" frontend/public/index.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "frontend/public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

